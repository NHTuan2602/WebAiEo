  </defs>
  <circle cx="160" cy="160" r="142" fill="url(#pikaAura)"/>

  <!-- Lightning Bolt Tail -->
  <polygon points="96,238 48,216 62,190 22,158 58,136 88,168 74,192 108,212" fill="#facc15" stroke="#854d0e" stroke-width="3.4" stroke-linejoin="round"/>

