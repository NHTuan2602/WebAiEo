<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="pikaAura" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pikaYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
