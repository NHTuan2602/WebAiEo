  <circle cx="178" cy="104" r="10" fill="#0f172a"/>
  <circle cx="181" cy="100" r="3.8" fill="#ffffff"/>
  <!-- Bright Red Electric Cheeks -->
  <circle cx="104" cy="128" r="13" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <circle cx="200" cy="128" r="13" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <!-- Tiny nose & ICONIC SURPRISED :O MOUTH!! -->
  <polygon points="148,116 156,116 152,121" fill="#0f172a"/>
  <ellipse cx="152" cy="140" rx="13" ry="15" fill="#991b1b" stroke="#450a0a" stroke-width="3"/>
  <ellipse cx="152" cy="146" rx="8" ry="6" fill="#fb7185"/>
  <text x="234" y="84" font-family="Impact, sans-serif" font-size="22" fill="#fde047" stroke="#991b1b" stroke-width="1">:O?!</text>

  <!-- Crimson Thunder Greatsword -->
  <g transform="rotate(-30 248 184)">
    <polygon points="248,54 266,86 260,224 236,224 230,86" fill="#f43f5e" stroke="#450a0a" stroke-width="3.4"/>
    <line x1="248" y1="70" x2="248" y2="216" stroke="#fde047" stroke-width="3"/>
    <rect x="218" y="222" width="60" height="10" rx="4" fill="#fde047" stroke="#78350f" stroke-width="2.6"/>
