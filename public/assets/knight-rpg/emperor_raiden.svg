  <ellipse cx="152" cy="118" rx="58" ry="50" fill="url(#pikaYellow)" stroke="#854d0e" stroke-width="3.8"/>
  <!-- Wide Shocked Eyes -->
  <circle cx="126" cy="104" r="10" fill="#0f172a"/>
