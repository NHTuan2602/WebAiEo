<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="magmaAura" cx="56%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.38"/>
      <stop offset="58%" stop-color="#dc2626" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obsidianPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="lavaEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="furPelt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="warlordSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c6a5"/>
      <stop offset="100%" stop-color="#c28562"/>
    </linearGradient>
    <filter id="lavaGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="164" cy="158" r="138" fill="url(#magmaAura)"/>

  <!-- Tattered Ember War Cape -->
  <path d="M114 108 C70 128 36 178 18 258 L54 246 L68 264 L96 244 L118 256 L136 140 Z" fill="#7f1d1d" stroke="#090d16" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Heavy Warlord Legs & Spiked Greaves -->
  <path d="M112 204 L88 264 L76 296 L116 298 L130 264 L144 214 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.8" stroke-linejoin="round"/>
  <path d="M158 204 L182 258 L182 296 L224 298 L212 252 L188 206 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.8" stroke-linejoin="round"/>
  <!-- Glowing Magma Knee Runes -->
  <polygon points="98,244 120,236 126,254 106,260" fill="url(#lavaEdge)" stroke="#090d16" stroke-width="2.5"/>
  <polygon points="178,242 202,236 206,254 184,260" fill="url(#lavaEdge)" stroke="#090d16" stroke-width="2.5"/>

  <!-- Heavy Muscular Obsidian Chestplate -->
  <path d="M104 108 L188 106 L180 202 L114 202 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.8" stroke-linejoin="round"/>
  <!-- Glowing Magma Cracks across Armor -->
  <path d="M130 124 L148 148 L168 130 M148 148 L146 176 L132 188 M146 176 L162 188" stroke="url(#lavaEdge)" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#lavaGlow)"/>
  <!-- Skull War Belt -->
  <rect x="110" y="186" width="74" height="18" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="2.4"/>
  <circle cx="148" cy="195" r="8" fill="#e2e8f0" stroke="#090d16" stroke-width="2"/>
  <circle cx="145" cy="194" r="1.8" fill="#ef4444"/>
  <circle cx="151" cy="194" r="1.8" fill="#ef4444"/>

  <!-- Wolf-Pelt Fur Mantle around Shoulders -->
  <path d="M88 118 C92 92 126 88 150 96 C174 88 206 94 208 122 L192 134 L176 122 L152 132 L126 120 L106 134 Z" fill="url(#furPelt)" stroke="#090d16" stroke-width="3" stroke-linejoin="round"/>
  <!-- Massive Spiked Shoulder Pauldron -->
  <path d="M84 114 C82 90 116 86 128 110 L122 142 L90 138 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.4"/>
  <polygon points="90,98 70,74 102,90" fill="#cbd5e1" stroke="#090d16" stroke-width="2.5"/>
  <polygon points="108,92 100,66 118,88" fill="#cbd5e1" stroke="#090d16" stroke-width="2.5"/>

  <!-- Head, Scarred Warlord Face & Wild Silver-White Mane -->
  <path d="M128 60 C128 42 168 42 172 68 C174 88 164 102 148 102 C132 100 126 84 128 60 Z" fill="url(#warlordSkin)" stroke="#090d16" stroke-width="3"/>
  <!-- Fierce Burning Eyes & Cheek Scar -->
  <path d="M144 68 L156 72" stroke="#090d16" stroke-width="3" stroke-linecap="round"/>
  <path d="M162 72 L170 68" stroke="#090d16" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="152" cy="76" r="2.8" fill="#f97316"/>
  <circle cx="164" cy="76" r="2.6" fill="#f97316"/>
  <line x1="158" y1="68" x2="162" y2="88" stroke="#991b1b" stroke-width="2.2"/>
  <path d="M144 90 Q154 85 164 90" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
  <!-- Wild Silver Mane -->
  <path d="M120 76 C110 42 136 22 166 32 C184 38 186 58 176 70 C170 54 152 50 138 60 C130 66 126 80 120 92 Z" fill="#e2e8f0" stroke="#090d16" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M126 44 L96 36 L116 54 L90 62 L120 68" fill="#cbd5e1" stroke="#090d16" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Muscular Armored Arms -->
  <path d="M98 136 L114 176 L158 186 L166 170 L128 160 L118 134 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.2"/>
  <path d="M174 134 L194 166 L182 182 L166 172 L168 152 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.2"/>

  <!-- Colossal Magma Battleaxe "Ragnarok" -->
  <rect x="132" y="176" width="140" height="12" rx="4" transform="rotate(-22 202 182)" fill="#334155" stroke="#090d16" stroke-width="3"/>
  <g filter="url(#lavaGlow)">
    <!-- Double-Crescent Molten Greataxe Head -->
    <path d="M236 128 C272 104 304 128 310 172 C292 188 264 190 246 168 L236 128 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M262 114 C292 112 310 138 312 172 C298 182 288 182 280 178 C294 160 288 130 262 114 Z" fill="url(#lavaEdge)"/>
    <path d="M222 146 C204 118 220 92 248 86 C258 100 256 120 240 134 Z" fill="url(#obsidianPlate)" stroke="#090d16" stroke-width="3.2"/>
    <path d="M214 114 C216 94 234 86 248 86 C236 96 226 108 224 124 Z" fill="url(#lavaEdge)"/>
  </g>
  <circle cx="164" cy="182" r="11" fill="url(#obsidianPlate)" stroke="#f97316" stroke-width="2.5"/>
  <circle cx="192" cy="171" r="10" fill="url(#obsidianPlate)" stroke="#f97316" stroke-width="2.5"/>
</svg>
