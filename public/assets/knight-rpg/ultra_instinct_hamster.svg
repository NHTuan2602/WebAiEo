<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="uiAura" cx="50%" cy="50%" r="54%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hamsterFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="65%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Blazing Silver-Cyan Ultra Instinct Flame Aura! -->
  <circle cx="160" cy="160" r="146" fill="url(#uiAura)"/>
  <path d="M66 268 C42 204 58 118 104 68 C94 108 112 118 128 52 C148 92 168 84 184 44 C202 96 222 92 232 68 C266 126 274 206 248 268 Z" fill="#bae6fd" fill-opacity="0.35" stroke="#e0f2fe" stroke-width="3"/>

  <!-- Tiny Trembling Round Hamster Body + Peace Sign ("✌️") Paw! -->
  <circle cx="114" cy="96" r="18" fill="url(#hamsterFur)" stroke="#7c2d12" stroke-width="3.4"/>
  <circle cx="186" cy="96" r="18" fill="url(#hamsterFur)" stroke="#7c2d12" stroke-width="3.4"/>
  <ellipse cx="150" cy="184" rx="58" ry="74" fill="url(#hamsterFur)" stroke="#7c2d12" stroke-width="3.8"/>
  <ellipse cx="150" cy="198" rx="40" ry="54" fill="#fff7ed"/>

  <!-- Glowing Silver Ultra-Instinct Eyes + Tiny Scared Mouth -->
  <circle cx="128" cy="140" r="13" fill="#0f172a"/>
  <circle cx="128" cy="140" r="7" fill="#e0f2fe"/>
  <circle cx="124" cy="136" r="3" fill="#ffffff"/>
  <circle cx="172" cy="140" r="13" fill="#0f172a"/>
  <circle cx="172" cy="140" r="7" fill="#e0f2fe"/>
  <circle cx="168" cy="136" r="3" fill="#ffffff"/>

  <polygon points="146,154 154,154 150,159" fill="#fb7185"/>
  <ellipse cx="150" cy="168" rx="7" ry="9" fill="#9f1239" stroke="#4c0519" stroke-width="2.4"/>

  <!-- Iconic Peace-Sign ("✌️") Left Paw! -->
  <g transform="translate(86, 178)">
    <ellipse cx="0" cy="12" rx="14" ry="12" fill="#fed7aa" stroke="#7c2d12" stroke-width="3"/>
    <rect x="-9" y="-16" width="7" height="22" rx="3.5" transform="rotate(-14 -5 -5)" fill="#fed7aa" stroke="#7c2d12" stroke-width="2.6"/>
    <rect x="2" y="-16" width="7" height="22" rx="3.5" transform="rotate(14 5 -5)" fill="#fed7aa" stroke="#7c2d12" stroke-width="2.6"/>
  </g>

  <!-- Cosmic Sunflower-Seed Silver Spear -->
  <g transform="rotate(-24 240 176)">
    <rect x="235" y="106" width="10" height="162" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <path d="M240 44 C260 68 258 104 240 114 C222 104 220 68 240 44 Z" fill="#1e293b" stroke="#f8fafc" stroke-width="3.4"/>
    <line x1="240" y1="52" x2="240" y2="108" stroke="#f8fafc" stroke-width="3"/>
  </g>
</svg>
