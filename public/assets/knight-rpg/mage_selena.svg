  <!-- Giant Staring Mascot Owl Eyes (Intense 23:59 Streak Pressure!) -->
  <circle cx="122" cy="122" r="28" fill="#ffffff" stroke="#14532d" stroke-width="3.4"/>
  <circle cx="182" cy="122" r="28" fill="#ffffff" stroke="#14532d" stroke-width="3.4"/>
  <circle cx="126" cy="124" r="12" fill="#0f172a"/>
  <circle cx="130" cy="118" r="4" fill="#ffffff"/>
  <circle cx="178" cy="124" r="12" fill="#0f172a"/>
