<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="maxwellAura" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="160" cy="160" r="142" fill="url(#maxwellAura)"/>

  <!-- 360° Dynamic Spin Rings Around Maxwell the Tuxedo Cat! -->
  <ellipse cx="160" cy="196" rx="124" ry="34" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="18 10"/>
  <ellipse cx="160" cy="182" rx="108" ry="26" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="12 12"/>

  <!-- Musical Notes Floating Around -->
  <text x="58" y="96" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#fde047">♪</text>
  <text x="246" y="88" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#f472b6">♫</text>

  <!-- Iconic Loaf-Shaped Tuxedo Cat ("Maxwell"!) -->
  <!-- Tail -->
  <path d="M68 188 C38 172 42 132 72 142" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <!-- Compact Loaf Body -->
  <path d="M72 198 C72 138 228 134 238 198 C242 226 216 238 156 238 C92 238 70 224 72 198 Z" fill="#0f172a" stroke="#334155" stroke-width="3.6"/>
  <!-- Crisp White Tuxedo Chest Bib & Paws Tucked Under -->
  <path d="M168 168 C168 150 226 150 232 196 C232 222 212 234 192 234 C174 234 166 216 168 168 Z" fill="#ffffff"/>

  <!-- Tuxedo Cat Head & Ears -->
  <polygon points="172,118 166,76 198,98" fill="#0f172a" stroke="#334155" stroke-width="3.2" stroke-linejoin="round"/>
  <polygon points="236,118 246,76 212,98" fill="#0f172a" stroke="#334155" stroke-width="3.2" stroke-linejoin="round"/>
  <ellipse cx="206" cy="132" rx="44" ry="36" fill="#0f172a" stroke="#334155" stroke-width="3.6"/>
  <!-- White Muzzle Blaze -->
  <polygon points="206,126 184,158 228,158" fill="#ffffff"/>

  <!-- Big Golden Eyes & Cute Whiskers -->
  <circle cx="190" cy="126" r="8" fill="#facc15"/>
  <circle cx="190" cy="126" r="4" fill="#090d16"/>
  <circle cx="222" cy="126" r="8" fill="#facc15"/>
  <circle cx="222" cy="126" r="4" fill="#090d16"/>
  <polygon points="202,140 210,140 206,145" fill="#fb7185"/>
  <line x1="234" y1="140" x2="264" y2="136" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="234" y1="148" x2="264" y2="150" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Floating Holographic Vinyl Record Catalyst Disc Above Head -->
  <ellipse cx="144" cy="76" rx="38" ry="14" fill="#1e1b4b" stroke="#22d3ee" stroke-width="3.2"/>
  <ellipse cx="144" cy="76" rx="14" ry="5" fill="#f472b6"/>
</svg>
