      <stop offset="0%" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bananaSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#bananaGlow)"/>

  <!-- Giant Puddle of Tears on Floor -->
  <ellipse cx="154" cy="284" rx="108" ry="16" fill="#38bdf8" opacity="0.65"/>

