  <path d="M150 46 C96 72 86 184 112 268 C138 282 172 282 196 268 C220 184 208 72 150 46 Z" fill="url(#bananaSuit)" stroke="#713f12" stroke-width="4" stroke-linejoin="round"/>
  <!-- Peeled Banana Flaps -->
  <path d="M104 168 C68 182 64 218 92 224 C104 214 108 192 108 178 Z" fill="#fef9c3" stroke="#713f12" stroke-width="3.2"/>
  <path d="M202 168 C238 182 242 218 214 224 C202 214 198 192 198 178 Z" fill="#fef9c3" stroke="#713f12" stroke-width="3.2"/>

  <!-- Little Grey/Tabby Cat Feet -->
