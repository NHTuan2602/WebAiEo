  <ellipse cx="174" cy="276" rx="14" ry="10" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>

  <!-- Sad Crying Cat Face Window Inside Banana Suit -->
  <ellipse cx="152" cy="126" rx="38" ry="34" fill="#cbd5e1" stroke="#334155" stroke-width="3.5"/>
  <!-- Big Glossy Watery Eyes + Waterfall Tears ("HU HU HU"!) -->
  <path d="M126 124 C118 164 114 224 118 278 L134 278 C132 224 134 164 140 124 Z" fill="#38bdf8" opacity="0.85"/>
  <path d="M164 124 C170 164 172 224 170 278 L186 278 C190 224 186 164 178 124 Z" fill="#38bdf8" opacity="0.85"/>

  <circle cx="134" cy="118" r="10" fill="#0f172a"/>
  <circle cx="131" cy="114" r="3.8" fill="#ffffff"/>
  <circle cx="170" cy="118" r="10" fill="#0f172a"/>
  <circle cx="167" cy="114" r="3.8" fill="#ffffff"/>
  <!-- Trembling Wailing Cat Mouth -->
  <path d="M140 140 Q152 132 164 140 Q160 152 152 150 Q144 152 140 140 Z" fill="#fb7185" stroke="#881337" stroke-width="2.4"/>

  <!-- Golden Banana Sword -->
  <g transform="rotate(-28 242 182)">
    <path d="M236 86 C258 118 258 176 240 212 L228 208 C242 172 242 122 226 92 Z" fill="#fde047" stroke="#713f12" stroke-width="3.2"/>
