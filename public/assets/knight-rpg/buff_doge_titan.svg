  <ellipse cx="66" cy="166" rx="34" ry="44" fill="url(#dogeMuscle)" stroke="#451a03" stroke-width="4"/>
  <ellipse cx="242" cy="166" rx="34" ry="44" fill="url(#dogeMuscle)" stroke="#451a03" stroke-width="4"/>
