  <circle cx="154" cy="239" r="9" fill="#fde047" stroke="#78350f" stroke-width="2.5"/>
  <rect x="112" y="248" width="32" height="40" rx="10" fill="url(#dogeMuscle)" stroke="#451a03" stroke-width="3.5"/>
  <rect x="164" y="248" width="32" height="40" rx="10" fill="url(#dogeMuscle)" stroke="#451a03" stroke-width="3.5"/>

