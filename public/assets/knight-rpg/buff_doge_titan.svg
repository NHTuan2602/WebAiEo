  <polygon points="184,62 192,32 166,48" fill="url(#dogeMuscle)" stroke="#451a03" stroke-width="3.2" stroke-linejoin="round"/>
  <ellipse cx="154" cy="80" rx="38" ry="34" fill="url(#dogeMuscle)" stroke="#451a03" stroke-width="3.6"/>
  <ellipse cx="154" cy="88" rx="26" ry="20" fill="#fffbeb"/>
  <!-- Determined Doge Side-Glance -->
  <circle cx="141" cy="74" r="4.5" fill="#1c1917"/>
  <circle cx="167" cy="74" r="4.5" fill="#1c1917"/>
  <path d="M134 66 L148 69 M160 69 L174 66" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="154" cy="84" rx="6" ry="4.5" fill="#1c1917"/>
  <path d="M142 94 Q154 100 166 94" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Giant 500KG Barbell Hammer Greatsword -->
  <g transform="rotate(-25 256 176)">
