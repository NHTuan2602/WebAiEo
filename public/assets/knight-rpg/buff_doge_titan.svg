  <path d="M96 126 L212 126 L192 226 L116 226 Z" fill="#fef3c7" opacity="0.88"/>
  <path d="M98 164 Q126 178 154 162 Q182 178 210 164" fill="none" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <line x1="154" y1="162" x2="154" y2="224" stroke="#92400e" stroke-width="3.5"/>
  <line x1="130" y1="186" x2="178" y2="186" stroke="#92400e" stroke-width="3.2"/>
