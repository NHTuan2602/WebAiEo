  <path d="M150 88 C162 96 164 114 146 116" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <!-- Iconic Giant Toothy Trollface Grin! -->
  <path d="M106 120 Q152 130 198 114 C194 148 168 156 150 156 C126 156 108 142 106 120 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3.2" stroke-linejoin="round"/>
  <line x1="112" y1="134" x2="192" y2="130" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="128" y1="122" x2="128" y2="152" stroke="#0f172a" stroke-width="2"/>
  <line x1="146" y1="124" x2="146" y2="155" stroke="#0f172a" stroke-width="2"/>
  <line x1="164" y1="122" x2="164" y2="154" stroke="#0f172a" stroke-width="2"/>
  <line x1="180" y1="118" x2="180" y2="148" stroke="#0f172a" stroke-width="2"/>

  <!-- Sunburst Circlet on Forehead -->
  <polygon points="150,26 158,48 180,44 166,60 134,60 120,44 142,48" fill="#fbbf24" stroke="#78350f" stroke-width="2.6"/>

  <!-- Giant Blinding Solar Claymore -->
  <g transform="rotate(-32 246 184)">
    <polygon points="246,42 266,76 258,224 234,224 226,76" fill="url(#trollArmor)" stroke="#451a03" stroke-width="3.6"/>
    <line x1="246" y1="62" x2="246" y2="216" stroke="#ffffff" stroke-width="3.5"/>
    <rect x="214" y="222" width="64" height="12" rx="4" fill="#dc2626" stroke="#450a0a" stroke-width="3"/>
    <rect x="240" y="234" width="12" height="28" rx="3" fill="#451a03"/>
