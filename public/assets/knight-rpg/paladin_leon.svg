  </defs>
  <circle cx="160" cy="160" r="142" fill="url(#trollAura)"/>

  <!-- Comic PROBLEM? Label -->
  <rect x="18" y="34" width="102" height="34" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="69" y="57" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="16" fill="#0f172a">PROBLEM?</text>

  <!-- Crimson Cape & Solar Knight Chestplate -->
  <path d="M90 162 C52 190 42 246 58 286 L228 286 C244 244 234 190 198 162 Z" fill="#dc2626" stroke="#450a0a" stroke-width="3.6"/>
  <path d="M104 170 L196 170 L184 252 L148 270 L114 252 Z" fill="url(#trollArmor)" stroke="#451a03" stroke-width="3.6" stroke-linejoin="round"/>
  <circle cx="150" cy="212" r="18" fill="#fef9c3" stroke="#b45309" stroke-width="3"/>

  <!-- Classic Trollface Chin & Cheekbones Head Silhouette -->
  <path d="M92 98 C94 54 146 42 184 56 C210 66 218 96 208 118 C202 132 192 162 152 166 C116 168 90 144 92 98 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3.8" stroke-linejoin="round"/>
