<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="orcSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="orcIron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orcAxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="orcLeather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Massive Double-Headed Battleaxe (held forward facing left) -->
  <g transform="translate(80 156) rotate(-24)">
    <rect x="-5" y="-128" width="11" height="218" rx="4" fill="#78350f" stroke="#0f172a" stroke-width="3"/>
    <!-- Double Axe Blades -->
    <path d="M-4 -112 C-42 -128 -58 -92 -52 -64 C-46 -40 -26 -38 -4 -52 Z" fill="url(#orcAxe)" stroke="#0f172a" stroke-width="3"/>
    <path d="M6 -112 C44 -128 60 -92 54 -64 C48 -40 28 -38 6 -52 Z" fill="url(#orcAxe)" stroke="#0f172a" stroke-width="3"/>
    <path d="M-46 -94 C-48 -78 -42 -62 -32 -54" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M48 -94 C50 -78 44 -62 34 -54" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="0,-142 10,-116 -10,-116" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="-10" y="-88" width="21" height="22" rx="3" fill="#b45309" stroke="#0f172a" stroke-width="2.5"/>
  </g>
  <!-- Heavy Muscular Legs & Iron Boots -->
  <path d="M124 212 L106 284 L146 290 L160 220 Z" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="3"/>
  <path d="M180 212 L202 284 L240 288 L216 212 Z" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="3"/>
  <path d="M100 264 L148 268 L148 296 L92 294 Z" fill="url(#orcIron)" stroke="#0f172a" stroke-width="3"/>
  <path d="M196 264 L244 264 L250 294 L196 294 Z" fill="url(#orcIron)" stroke="#0f172a" stroke-width="3"/>
  <!-- Hulking Torso & War Harness -->
  <path d="M110 108 Q168 88 228 112 L218 220 L122 220 Z" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Chest Muscles & Leather Cross-Straps -->
  <path d="M126 116 L210 202 M212 118 L128 202" stroke="url(#orcLeather)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="170" cy="158" r="14" fill="url(#orcIron)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="170" cy="158" r="5" fill="#f59e0b"/>
  <!-- War Loincloth & Skull Belt -->
  <path d="M118 202 L222 202 L226 244 L194 234 L170 250 L146 234 L114 244 Z" fill="url(#orcLeather)" stroke="#0f172a" stroke-width="3"/>
  <!-- Huge Spiked Iron Shoulder Pauldrons -->
  <path d="M96 120 Q114 78 152 104 L140 144 Q106 148 96 120 Z" fill="url(#orcIron)" stroke="#0f172a" stroke-width="3.5"/>
  <polygon points="108,98 86,70 124,90" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="126,90 120,62 142,88" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M192 104 Q236 80 252 126 Q238 152 202 146 Z" fill="url(#orcIron)" stroke="#0f172a" stroke-width="3.5"/>
  <polygon points="236,98 262,72 222,92" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Muscular Arms + Spiked Bracers -->
  <path d="M112 138 L78 176 L98 192 L134 156 Z" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="3"/>
  <rect x="74" y="164" width="26" height="22" rx="6" transform="rotate(-20 86 175)" fill="url(#orcIron)" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M222 142 L252 192 L230 206 L204 162 Z" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="242" cy="198" r="16" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="3"/>
  <!-- Fierce Orc Head with Tusks & War Mohawk -->
  <g transform="translate(158 84)">
    <!-- Pointed Ears -->
    <polygon points="28,-6 48,-18 36,6" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="-28,-6 -48,-18 -36,6" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="34" ry="32" fill="url(#orcSkin)" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Dark War Mohawk -->
    <path d="M-8 -30 Q4 -56 26 -42 Q18 -26 14 -26 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Iron Brow Band -->
    <path d="M-32 -12 Q0 -26 32 -12 L28 -2 Q0 -12 -28 -2 Z" fill="url(#orcIron)" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Glowing Angry Eyes -->
    <polygon points="-20,-4 -6,0 -18,5" fill="#fef08a" stroke="#7f1d1d" stroke-width="1.5"/>
    <polygon points="10,-4 -2,0 8,5" fill="#fef08a" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Snarling Mouth & Huge Lower Tusks -->
    <path d="M-22 14 Q-6 8 10 14 Q6 26 -18 26 Z" fill="#450a0a" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="-18,22 -24,0 -10,18" fill="#fefce8" stroke="#0f172a" stroke-width="2"/>
    <polygon points="6,22 12,0 -2,18" fill="#fefce8" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>
