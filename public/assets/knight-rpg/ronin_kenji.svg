<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="thunderAura" cx="55%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="indigoArmor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tealTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="katanaSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="roninSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde6cf"/>
      <stop offset="100%" stop-color="#dca680"/>
    </linearGradient>
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="165" cy="156" r="136" fill="url(#thunderAura)"/>

  <!-- Billowing Electric-Blue Ronin Scarf -->
  <path d="M132 104 C82 96 42 118 16 154 C46 146 72 152 104 138 C118 132 132 120 140 112 Z" fill="url(#scarfGrad)" stroke="#0f172a" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M126 112 C86 122 52 152 34 192 C62 178 90 170 120 140 Z" fill="#0284c7" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Dynamic Ronin Hakama Pants & Shinguards -->
  <path d="M120 194 L78 264 L66 294 L98 296 L116 266 L144 220 Z" fill="#1e293b" stroke="#090d16" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M158 196 L192 252 L198 296 L232 296 L220 248 L184 196 Z" fill="#1e293b" stroke="#090d16" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Cyan Greaves -->
  <path d="M80 258 L112 262 L98 295 L68 293 Z" fill="url(#indigoArmor)" stroke="#38bdf8" stroke-width="2.4"/>
  <path d="M192 252 L222 250 L232 295 L198 295 Z" fill="url(#indigoArmor)" stroke="#38bdf8" stroke-width="2.4"/>

  <!-- Layered Samurai Haori & Chest Plate -->
  <path d="M114 112 L182 110 L176 198 L118 198 Z" fill="url(#indigoArmor)" stroke="#090d16" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Crossed Chest Sash & Gold/Teal Lacing -->
  <path d="M124 114 L172 186" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <path d="M174 116 L124 184" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
  <rect x="116" y="182" width="64" height="15" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.4"/>

  <!-- Lamellar Samurai Sode Shoulder Guards -->
  <path d="M98 110 L132 104 L130 144 L94 142 Z" fill="url(#indigoArmor)" stroke="#38bdf8" stroke-width="2.6"/>
  <line x1="97" y1="120" x2="131" y2="118" stroke="#67e8f9" stroke-width="2"/>
  <line x1="96" y1="131" x2="130" y2="130" stroke="#67e8f9" stroke-width="2"/>
  <path d="M166 106 L202 114 L196 146 L166 140 Z" fill="url(#indigoArmor)" stroke="#38bdf8" stroke-width="2.6"/>
  <line x1="167" y1="120" x2="200" y2="124" stroke="#67e8f9" stroke-width="2"/>

  <!-- Head, Fierce Ronin Face & Spiky Dark Hair -->
  <rect x="138" y="94" width="20" height="16" fill="url(#roninSkin)"/>
  <path d="M132 62 C132 45 168 45 172 68 C174 86 164 100 150 100 C136 98 130 82 132 62 Z" fill="url(#roninSkin)" stroke="#0f172a" stroke-width="2.8"/>
  <!-- Sharp Glowing Electric Eyes -->
  <path d="M148 70 L158 72" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M164 72 L171 69" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="154" cy="76" r="2.7" fill="#38bdf8"/>
  <circle cx="166" cy="76" r="2.5" fill="#38bdf8"/>
  <path d="M150 89 L164 87" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>

  <!-- Spiky Dark Hair + High Ronin Ponytail -->
  <path d="M126 76 C118 46 136 28 164 34 C180 38 184 54 176 66 C168 54 152 52 142 60 C134 66 132 76 128 84 Z" fill="#0f172a" stroke="#020617" stroke-width="2.5"/>
  <path d="M134 40 C106 24 84 42 74 64 C96 56 112 58 128 50 Z" fill="#1e293b" stroke="#020617" stroke-width="2.5"/>
  <!-- Glowing Cyan Headband -->
  <path d="M130 58 Q154 50 174 60" stroke="#38bdf8" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M130 58 L92 66 L104 75 L130 63 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Arms holding Lightning Katana -->
  <path d="M110 134 L126 168 L164 176 L170 162 L136 154 L126 130 Z" fill="url(#indigoArmor)" stroke="#0f172a" stroke-width="2.8"/>
  <path d="M174 134 L188 166 L176 178 L162 170 L166 152 Z" fill="url(#indigoArmor)" stroke="#0f172a" stroke-width="2.8"/>

  <!-- Crackling Thunder Katana "Raijin" -->
  <g filter="url(#boltGlow)">
    <path d="M180 168 Q248 148 310 112 Q256 162 184 178 Z" fill="url(#katanaSteel)" stroke="#0284c7" stroke-width="2.4"/>
    <!-- Electric Lightning Arcs wrapping the blade -->
    <polyline points="196,166 214,148 222,162 246,136 256,152 282,122 298,126 310,112" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="208,172 228,176 242,158 264,160 286,134" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <!-- Katana Tsuba & Hilt -->
  <ellipse cx="180" cy="173" rx="6" ry="14" transform="rotate(-18 180 173)" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
  <rect x="142" y="172" width="36" height="9" rx="3" transform="rotate(-16 160 176)" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="168" cy="176" r="9" fill="#1e293b" stroke="#38bdf8" stroke-width="2.4"/>
</svg>
