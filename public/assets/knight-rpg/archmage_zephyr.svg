  <path d="M132 62 C132 44 172 44 172 64 C172 84 162 98 152 98 C142 98 132 84 132 62 Z" fill="url(#mageSkin)" stroke="#0f172a" stroke-width="2.6"/>
  <circle cx="145" cy="72" r="2.8" fill="#38bdf8"/>
  <circle cx="160" cy="72" r="2.8" fill="#38bdf8"/>
  <path d="M147 85 Q152 88 158 85" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>

  <!-- Silver Astral Hair & Crown -->
  <path d="M124 76 C118 44 138 26 160 30 C182 34 188 58 176 78 C170 58 158 50 144 54 C134 56 130 68 124 76 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.2"/>
  <polygon points="134,42 144,24 152,36 160,20 168,36 176,24 170,44" fill="url(#goldTrim)" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Floating Celestial Grimoire & Grand Scepter -->
  <g transform="translate(72, 162) rotate(-14)">
