  </defs>

  <circle cx="160" cy="156" r="138" fill="url(#zephyrAura)"/>
  <circle cx="160" cy="148" r="106" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>

