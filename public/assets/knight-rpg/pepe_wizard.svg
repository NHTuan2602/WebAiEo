  <ellipse cx="151" cy="88" rx="74" ry="14" fill="url(#wizRobe)" stroke="url(#starGold)" stroke-width="3.4"/>
  <rect x="118" y="74" width="66" height="10" rx="4" fill="url(#starGold)" stroke="#78350f" stroke-width="2"/>

  <!-- Glowing Floating IELTS 9.0 Spellbook & frog hand casting magic -->
  <g transform="translate(244, 188) rotate(-10)">
    <rect x="-32" y="-38" width="64" height="76" rx="8" fill="#7e22ce" stroke="url(#starGold)" stroke-width="3.6"/>
    <rect x="-24" y="-30" width="48" height="60" rx="4" fill="#1e1b4b"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="#fde047">9.0</text>
