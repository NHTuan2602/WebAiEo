  <polygon points="104,236 108,245 118,245 110,251 113,260 104,254 95,260 98,251 90,245 100,245" fill="#fde047"/>
  <polygon points="200,246 203,253 211,253 205,258 207,265 200,260 193,265 195,258 189,253 197,253" fill="#fde047"/>

  <!-- Pepe Frog Head & Bulging Eyes ("Feels Good Man" Smug Archmage!) -->
  <circle cx="128" cy="108" r="24" fill="url(#frogGreen)" stroke="#14532d" stroke-width="3.5"/>
  <circle cx="176" cy="108" r="24" fill="url(#frogGreen)" stroke="#14532d" stroke-width="3.5"/>
  <ellipse cx="152" cy="144" rx="64" ry="44" fill="url(#frogGreen)" stroke="#14532d" stroke-width="3.8"/>

  <!-- Big Half-Lidded Smug Pepe Eyes -->
  <ellipse cx="128" cy="110" rx="16" ry="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
  <circle cx="132" cy="112" r="7" fill="#0f172a"/>
  <circle cx="135" cy="109" r="2.5" fill="#ffffff"/>
  <path d="M111 106 Q128 96 145 106 L144 100 Q128 91 112 100 Z" fill="#16a34a" stroke="#14532d" stroke-width="2"/>

  <ellipse cx="176" cy="110" rx="16" ry="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
  <circle cx="180" cy="112" r="7" fill="#0f172a"/>
  <circle cx="183" cy="109" r="2.5" fill="#ffffff"/>
  <path d="M159 106 Q176 96 193 106 L192 100 Q176 91 160 100 Z" fill="#16a34a" stroke="#14532d" stroke-width="2"/>

  <!-- Iconic Wide Red-Brown Smug Pepe Lips -->
  <path d="M104 154 Q152 168 202 150 Q196 166 152 170 Q110 168 104 154 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M106 155 Q152 162 200 151" fill="none" stroke="#450a0a" stroke-width="2.4"/>

  <!-- Pointed Starry Archmage Hat -->
