<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="catAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="royalCape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="60%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="whiteCat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="138" fill="url(#catAura)"/>

  <!-- Royal Mage Velvet Chair Back -->
  <rect x="74" y="102" width="132" height="156" rx="22" fill="#7f1d1d" stroke="url(#goldTrim)" stroke-width="5"/>

  <!-- Royal Purple Mage Cloak -->
  <path d="M84 166 C66 205 68 252 88 278 L196 278 C212 248 210 202 194 166 Z" fill="url(#royalCape)" stroke="#1e1b4b" stroke-width="3.6"/>
  <path d="M114 166 L140 210 L166 166" fill="#fef08a" stroke="#78350f" stroke-width="2.5"/>

  <!-- White Cat Head & Pink Ears (Smudge the Table Cat Pose!) -->
  <polygon points="94,104 82,52 126,80" fill="url(#whiteCat)" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="98,96 90,64 118,82" fill="#fda4af"/>
  <polygon points="186,104 198,52 154,80" fill="url(#whiteCat)" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="182,96 190,64 162,82" fill="#fda4af"/>

  <!-- Tiny Golden Crown -->
  <polygon points="122,74 128,50 140,64 152,48 160,74" fill="url(#goldTrim)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round"/>

  <ellipse cx="140" cy="124" rx="54" ry="44" fill="url(#whiteCat)" stroke="#334155" stroke-width="3.6"/>

  <!-- Iconic Squinting Confused/Disgusted Smudge Expression! -->
  <path d="M104 110 L128 116" stroke="#1e293b" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M152 116 L176 110" stroke="#1e293b" stroke-width="3.6" stroke-linecap="round"/>
  <ellipse cx="117" cy="119" rx="9" ry="4.2" fill="#fde047" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="117" cy="119" r="2.5" fill="#0f172a"/>
  <ellipse cx="163" cy="119" rx="9" ry="4.2" fill="#fde047" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="163" cy="119" r="2.5" fill="#0f172a"/>

  <!-- Scrunched Pink Nose & Open Annoyed Hiss Mouth Showing Tiny Fangs -->
  <polygon points="135,127 145,127 140,133" fill="#fb7185" stroke="#881337" stroke-width="1.5"/>
  <path d="M122 142 Q140 135 158 142 Q154 154 140 154 Q126 154 122 142 Z" fill="#9f1239" stroke="#1e293b" stroke-width="2.6"/>
  <polygon points="128,141 132,147 135,140" fill="#ffffff"/>
  <polygon points="145,140 148,147 152,141" fill="#ffffff"/>
  <!-- Whiskers -->
  <line x1="74" y1="126" x2="102" y2="130" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="74" y1="136" x2="102" y2="136" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="178" y1="130" x2="206" y2="126" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="178" y1="136" x2="206" y2="136" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Banquet Table & Glowing Arcane Salad Plate + Levitating Golden Trident Fork -->
  <rect x="44" y="238" width="232" height="48" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="3.6"/>
  <ellipse cx="148" cy="252" rx="52" ry="15" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
  <path d="M116 250 C122 234 140 236 148 246 C158 234 176 236 180 250 Z" fill="#22c55e" stroke="#14532d" stroke-width="2.4"/>
  <circle cx="136" cy="247" r="4.5" fill="#ef4444"/>
  <circle cx="162" cy="248" r="4.5" fill="#ef4444"/>

  <!-- White Paws on Table Edge -->
  <ellipse cx="92" cy="238" rx="15" ry="10" fill="url(#whiteCat)" stroke="#334155" stroke-width="3"/>
  <ellipse cx="202" cy="232" rx="15" ry="10" fill="url(#whiteCat)" stroke="#334155" stroke-width="3"/>

  <!-- Floating Arcane Salad Catalyst Orb & Golden Fork Staff -->
  <circle cx="250" cy="148" r="28" fill="#10b981" fill-opacity="0.28" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4"/>
  <g transform="rotate(24 246 168)">
    <rect x="242" y="128" width="7" height="96" rx="3.5" fill="url(#goldTrim)" stroke="#78350f" stroke-width="2.4"/>
    <path d="M233 130 L233 108 M245.5 130 L245.5 104 M258 130 L258 108 M233 130 Q245.5 136 258 130" fill="none" stroke="url(#goldTrim)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
