<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="55%" r="52%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="160" cy="165" r="144" fill="url(#fireGlow)"/>

  <!-- Roaring Cartoon Flames Surrounding Everything ("THIS IS FINE"!) -->
  <path d="M28 274 C18 220 44 176 58 148 C64 182 78 192 84 166 C98 202 104 238 92 274 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
  <path d="M42 274 C36 236 52 204 62 186 C68 210 78 218 80 274 Z" fill="#facc15"/>
  <path d="M228 274 C218 228 234 184 252 150 C258 184 274 190 282 162 C298 204 298 244 286 274 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
  <path d="M242 274 C238 236 250 206 260 186 C268 214 276 226 276 274 Z" fill="#facc15"/>

  <!-- Wooden Chair & Table -->
  <rect x="86" y="244" width="152" height="36" rx="10" fill="#92400e" stroke="#451a03" stroke-width="3.5"/>

  <!-- Calm Yellow Hound Dog Body in Knight Vest -->
  <ellipse cx="144" cy="216" rx="44" ry="42" fill="#fbbf24" stroke="#451a03" stroke-width="3.6"/>
  <path d="M110 186 L178 186 L172 238 L116 238 Z" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>

