  <ellipse cx="186" cy="130" rx="14" ry="28" fill="#78350f" stroke="#290f02" stroke-width="3.2" transform="rotate(-12 186 130)"/>
  <ellipse cx="146" cy="124" rx="44" ry="40" fill="#fbbf24" stroke="#451a03" stroke-width="3.6"/>
  <!-- Long Snout & Black Nose -->
  <ellipse cx="174" cy="134" rx="28" ry="18" fill="#fde68a" stroke="#451a03" stroke-width="3.2"/>
  <circle cx="198" cy="128" r="7" fill="#1c1917"/>

  <!-- Tiny Brown Bowler Hat -->
  <ellipse cx="142" cy="84" rx="34" ry="8" fill="#78350f" stroke="#290f02" stroke-width="3"/>
  <path d="M118 84 C118 56 166 56 166 84 Z" fill="#92400e" stroke="#290f02" stroke-width="3"/>

  <!-- Wide Unblinking "Everything Is Fine" Eyes & Big Calm Smile -->
  <circle cx="136" cy="112" r="10" fill="#ffffff" stroke="#1c1917" stroke-width="2.8"/>
  <circle cx="138" cy="112" r="3.5" fill="#1c1917"/>
  <circle cx="162" cy="112" r="10" fill="#ffffff" stroke="#1c1917" stroke-width="2.8"/>
  <circle cx="164" cy="112" r="3.5" fill="#1c1917"/>
  <path d="M148 144 Q168 156 186 144" fill="none" stroke="#451a03" stroke-width="3.2" stroke-linecap="round"/>

  <!-- White Coffee Mug Held Calmly + Flame Sword -->
  <rect x="184" y="204" width="32" height="36" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="3.2"/>
  <path d="M216 212 C228 212 228 232 216 232" fill="none" stroke="#1e293b" stroke-width="3.5"/>
  <path d="M194 196 Q198 186 194 178 M206 196 Q210 186 206 178" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blazing Sword Stuck Ready Beside Table -->
  <g transform="rotate(18 256 196)">
    <polygon points="256,88 266,112 262,216 250,216 246,112" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
    <rect x="240" y="214" width="32" height="8" rx="3" fill="#fbbf24" stroke="#451a03" stroke-width="2.5"/>
