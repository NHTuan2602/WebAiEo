<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="chadAura" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#cbd5e1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chadSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="chadBeard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="platinumGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="142" fill="url(#chadAura)"/>

  <!-- Flowing Golden-Crimson Emperor Cape -->
  <path d="M96 118 C52 146 34 214 48 282 C84 272 114 278 136 258 Z" fill="#991b1b" stroke="#450a0a" stroke-width="3.6"/>

