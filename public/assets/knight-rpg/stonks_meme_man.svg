<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="stonksAura" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mannequinHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="stonksArrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="142" fill="url(#stonksAura)"/>

  <!-- Stock Chart Grid Background + Giant Rising STONKS Arrow Spear! -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.8">
    <line x1="36" y1="70" x2="284" y2="70"/>
    <line x1="36" y1="115" x2="284" y2="115"/>
    <line x1="36" y1="160" x2="284" y2="160"/>
    <line x1="80" y1="46" x2="80" y2="210"/>
    <line x1="160" y1="46" x2="160" y2="210"/>
    <line x1="240" y1="46" x2="240" y2="210"/>
  </g>

  <!-- Giant Glowing Orange STONKS Arrow Polearm -->
  <path d="M40 236 L118 176 L154 202 L262 78" fill="none" stroke="url(#stonksArrow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="286,52 276,98 242,68" fill="#fde047" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
  <text x="236" y="142" font-family="Impact, Arial Black, sans-serif" font-size="22" fill="#fde047" stroke="#7c2d12" stroke-width="1">STONKS</text>

  <!-- Sharp Black Business Suit & Red Power Tie + Crossed Arms -->
  <path d="M74 166 L206 166 L218 288 L62 288 Z" fill="#0f172a" stroke="#334155" stroke-width="3.6" stroke-linejoin="round"/>
  <polygon points="122,166 158,166 140,224" fill="#ffffff"/>
  <polygon points="135,172 145,172 148,220 140,232 132,220" fill="#dc2626"/>
  <!-- Crossed Suit Arms -->
  <path d="M76 218 L198 206 L202 242 L80 250 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <ellipse cx="188" cy="218" rx="14" ry="10" fill="url(#mannequinHead)" stroke="#334155" stroke-width="2.5"/>

  <!-- Iconic Smooth 3D Mannequin "Meme Man" Head Looking Slightly Right -->
  <rect x="128" y="140" width="24" height="28" fill="url(#mannequinHead)" stroke="#334155" stroke-width="2.8"/>
  <path d="M104 82 C104 42 176 42 180 84 C184 122 168 148 144 150 C116 148 102 120 104 82 Z" fill="url(#mannequinHead)" stroke="#334155" stroke-width="3.5"/>
  <!-- Cool Confident Eyes & Smirk -->
  <ellipse cx="134" cy="92" rx="7" ry="4.5" fill="#0284c7"/>
  <ellipse cx="164" cy="92" rx="7" ry="4.5" fill="#0284c7"/>
  <path d="M124 83 L143 85 M155 85 L172 83" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 96 L156 114 L146 116" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134 128 Q150 134 166 126" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
</svg>
